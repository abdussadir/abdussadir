<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 218" width="480" height="218" role="img" aria-label="GitHub stats for Abdus Sadir">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080f1c"/><stop offset="55%" stop-color="#0b1a2b"/><stop offset="100%" stop-color="#07171a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="clip"><rect width="480" height="218" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .title { fill: #f8fafc; font-weight: 700; }
    .label { fill: #94a3b8; }
    .value { fill: #e2e8f0; font-weight: 600; }
    .accentText { fill: #22d3ee; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="480" height="218" fill="url(#bg)"/>
    
    <text class="mono title" x="28" y="38" font-size="17">GitHub Stats</text>
    <text class="mono accentText" x="452" y="38" font-size="12" text-anchor="end">@abdussadir</text>
    <line x1="28" y1="50" x2="452" y2="50" stroke="#1e3a4c" stroke-width="1"/>
    
    <text class="mono label" x="28" y="74" font-size="13">Public repos</text>
    <text class="mono value" x="452" y="74" font-size="13" text-anchor="end">4</text>
    <text class="mono label" x="28" y="100" font-size="13">Followers</text>
    <text class="mono value" x="452" y="100" font-size="13" text-anchor="end">1</text>
    <text class="mono label" x="28" y="126" font-size="13">Following</text>
    <text class="mono value" x="452" y="126" font-size="13" text-anchor="end">3</text>
    <text class="mono label" x="28" y="152" font-size="13">Total stars</text>
    <text class="mono value" x="452" y="152" font-size="13" text-anchor="end">0</text>
    <text class="mono label" x="28" y="178" font-size="13">On GitHub since</text>
    <text class="mono value" x="452" y="178" font-size="13" text-anchor="end">Jul 2023</text>
    <rect x="0" y="215" width="480" height="3" fill="url(#accent)"/>
    <rect x="0.5" y="0.5" width="479" height="217" rx="14" fill="none" stroke="#1e3a4c"/>
  </g>
</svg>
