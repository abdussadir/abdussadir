<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-label="Most used languages">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080f1c"/><stop offset="55%" stop-color="#0b1a2b"/><stop offset="100%" stop-color="#07171a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <clipPath id="clip"><rect width="480" height="150" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .title { fill: #f8fafc; font-weight: 700; }
    .label { fill: #94a3b8; }
    .value { fill: #e2e8f0; font-weight: 600; }
    .accentText { fill: #22d3ee; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="480" height="150" fill="url(#bg)"/>
    
    <text class="mono title" x="28" y="34" font-size="17">Most Used Languages</text>
    <rect x="28" y="56" width="424" height="10" rx="5" fill="#0f2233"/>
    <g clip-path="url(#clip)"><rect x="28.00" y="56" width="363.14" height="10" fill="#e34c26"/><rect x="391.14" y="56" width="37.37" height="10" fill="#563d7c"/><rect x="428.50" y="56" width="23.50" height="10" fill="#f1e05a"/></g>
    
    <circle cx="28" cy="92" r="5" fill="#e34c26"/>
    <text class="mono label" x="42" y="96" font-size="12.5">HTML</text>
    <text class="mono value" x="238" y="96" font-size="12.5" text-anchor="end">85.6%</text>
    <circle cx="248" cy="92" r="5" fill="#563d7c"/>
    <text class="mono label" x="262" y="96" font-size="12.5">CSS</text>
    <text class="mono value" x="458" y="96" font-size="12.5" text-anchor="end">8.8%</text>
    <circle cx="28" cy="116" r="5" fill="#f1e05a"/>
    <text class="mono label" x="42" y="120" font-size="12.5">JavaScript</text>
    <text class="mono value" x="238" y="120" font-size="12.5" text-anchor="end">5.5%</text>
    <rect x="0" y="147" width="480" height="3" fill="url(#accent)"/>
    <rect x="0.5" y="0.5" width="479" height="149" rx="14" fill="none" stroke="#1e3a4c"/>
  </g>
</svg>
