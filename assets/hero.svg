<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="MD Abdus Sadir - Full-Stack Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080f1c"/>
      <stop offset="55%" stop-color="#0b1a2b"/>
      <stop offset="100%" stop-color="#07171a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="360" rx="20"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .prompt { fill: #22d3ee; }
    .cmd    { fill: #e2e8f0; }
    .out    { fill: #94a3b8; }
    .ok     { fill: #34d399; }
    .name   { fill: #f8fafc; }
    .line   { opacity: 0; animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
    .d4 { animation-delay: 1.05s } .d5 { animation-delay: 1.35s } .d6 { animation-delay: 1.65s }
    .d7 { animation-delay: 1.95s } .d8 { animation-delay: 2.25s }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    .caret { fill: #34d399; animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .35; r: 5 } 50% { opacity: 1; r: 7 } }
    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { 0% { transform: translateX(-420px) } 100% { transform: translateX(1260px) } }
    .float { animation: float 9s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
    .chip { fill: #0f2233; stroke: #1e3a4c; }
    .chipText { fill: #7dd3fc; letter-spacing: 1.4px; }
    .ring { fill: none; stroke: url(#accent); stroke-opacity: .5; }
    .spin { animation: spin 26s linear infinite; transform-origin: 1020px 168px; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .spinR { animation: spin 34s linear infinite reverse; transform-origin: 1020px 168px; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse class="float" cx="1030" cy="120" rx="300" ry="220" fill="url(#glowA)"/>
    <ellipse class="float" cx="140" cy="330" rx="280" ry="200" fill="url(#glowB)" style="animation-delay:-4s"/>
    <rect class="scan" x="0" y="0" width="420" height="360" fill="url(#sweep)"/>

    <!-- orbital emblem -->
    <g opacity="0.9">
      <circle class="ring spin" cx="1020" cy="168" r="118" stroke-width="1.2" stroke-dasharray="6 10"/>
      <circle class="ring spinR" cx="1020" cy="168" r="86" stroke-width="1.2" stroke-dasharray="2 12"/>
      <circle cx="1020" cy="168" r="54" fill="#0b1a2b" stroke="url(#accent)" stroke-width="1.6" stroke-opacity=".85"/>
      <text class="mono" x="1020" y="176" text-anchor="middle" font-size="30" font-weight="700" fill="url(#accent)">AS</text>
      <g class="spin"><circle cx="1138" cy="168" r="4.5" fill="#34d399"/></g>
      <g class="spinR"><circle cx="934" cy="168" r="3.5" fill="#38bdf8"/></g>
    </g>

    <!-- terminal chrome -->
    <g class="line d1">
      <rect x="56" y="46" width="720" height="268" rx="12" fill="#0a1727" fill-opacity=".82" stroke="#1b3244" stroke-width="1"/>
      <rect x="56" y="46" width="720" height="34" rx="12" fill="#0d2032" fill-opacity=".9"/>
      <rect x="56" y="68" width="720" height="12" fill="#0d2032" fill-opacity=".9"/>
      <circle cx="78" cy="63" r="5" fill="#ef4a5a"/><circle cx="96" cy="63" r="5" fill="#f0b429"/><circle cx="114" cy="63" r="5" fill="#2fc48d"/>
      <text class="mono out" x="140" y="67" font-size="12.5" letter-spacing=".6">abdussadir@github — ~/profile</text>
    </g>

    <g class="mono" font-size="15.5">
      <g class="line d2"><text x="82" y="118"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">whoami</tspan></text></g>
      <g class="line d3"><text class="sans name" x="82" y="152" font-size="32" font-weight="700">MD Abdus Sadir</text></g>
      <g class="line d4"><text x="82" y="180"><tspan class="out">→ Full-Stack Web Developer · Dhaka, Bangladesh</tspan></text></g>
      <g class="line d5"><text x="82" y="216"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">cat focus.txt</tspan></text></g>
      <g class="line d6"><text x="82" y="242"><tspan class="out">→ multi-tenant SaaS &amp; e-commerce systems — db to deploy</tspan></text></g>
      <g class="line d7"><text x="82" y="278"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">./ship --production</tspan><tspan class="caret" dx="8">▊</tspan></text></g>
    </g>

    <g class="line d8">
      <circle class="pulse" cx="90" cy="299" r="5" fill="#34d399"/>
      <text class="mono ok" x="106" y="304" font-size="12.5" letter-spacing=".8">OMSNex · live in production · serving real orders daily</text>
    </g>

    <g class="line d8" transform="translate(0,6)">
      <g><rect class="chip" x="820" y="286" width="86" height="26" rx="13" stroke-width="1"/><text class="mono chipText" x="863" y="303" text-anchor="middle" font-size="10.5">NODE.JS</text></g>
      <g><rect class="chip" x="914" y="286" width="86" height="26" rx="13" stroke-width="1"/><text class="mono chipText" x="957" y="303" text-anchor="middle" font-size="10.5">MYSQL</text></g>
      <g><rect class="chip" x="1008" y="286" width="122" height="26" rx="13" stroke-width="1"/><text class="mono chipText" x="1069" y="303" text-anchor="middle" font-size="10.5">SOCKET.IO</text></g>
    </g>

    <rect x="0" y="356" width="1200" height="4" fill="url(#accent)"/>
    <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#1e3a4c" stroke-width="1"/>
  </g>
</svg>
